name = "tidy-but-mighty"
main = "worker/index.js"
compatibility_date = "2026-04-01"
workers_dev = true

[assets]
directory = "publish_output/wwwroot"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
LEAD_NOTIFICATION_EMAIL = "tidybutmightycleaning@gmail.com"
BREVO_SENDER_EMAIL = "info@jbdigitalservices.net"

[[routes]]
pattern = "tidybutmighty.jbdigitalservices.net"
custom_domain = true
