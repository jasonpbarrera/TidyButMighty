name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Azure Functions API Build
        run: dotnet build Api/TidyButMighty.Api.csproj -c Release

      - name: Publish Blazor Client
        run: dotnet publish Client/TidyButMighty.Client.csproj -c Release -o publish_output

      - name: Build And Deploy
        id: builddeploy
        if: env.SWA_TOKEN != ''
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "publish_output/wwwroot"
          api_location: "Api"
          output_location: ""
          skip_app_build: true

      - name: Submit URLs to IndexNow
        if: github.event_name == 'push'
        run: |
          python3 -c '
          import json, urllib.request
          domain = "https://blue-stone-045cd4e0f.8.azurestaticapps.net"
          host = "blue-stone-045cd4e0f.8.azurestaticapps.net"
          urls = [
              f"{domain}/",
              f"{domain}/services",
              f"{domain}/about",
              f"{domain}/quote",
              f"{domain}/privacy",
              f"{domain}/terms"
          ]
          payload = json.dumps({
              "host": host,
              "key": "e3d29a08c8474f63bb9b7d8b5c9632f1",
              "keyLocation": f"{domain}/e3d29a08c8474f63bb9b7d8b5c9632f1.txt",
              "urlList": urls
          }).encode("utf-8")
          for ep in ["https://api.indexnow.org/indexnow", "https://www.bing.com/indexnow"]:
              try:
                  req = urllib.request.Request(ep, data=payload, headers={"Content-Type": "application/json; charset=utf-8", "User-Agent": "JBDigitalCI/1.0"})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      print(f"Submitted to {ep}: {resp.status}")
              except Exception as e:
                  print(f"Crawler notice ({ep}): {e}")
          '

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
